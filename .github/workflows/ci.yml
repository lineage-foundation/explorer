name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer
          POSTGRES_DB: explorer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorer"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://explorer:explorer@localhost:5432/explorer_test
      DATABASE_URL: postgres://explorer:explorer@localhost:5432/explorer_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Assert no schema drift
        run: |
          pnpm -F @explorer/db exec drizzle-kit generate
          git diff --exit-code packages/db/drizzle
      - name: Fresh-DB migrate smoke test
        run: |
          psql "$TEST_DATABASE_URL" -c 'create database explorer_migrate_smoke;'
          DATABASE_URL=postgres://explorer:explorer@localhost:5432/explorer_migrate_smoke \
            pnpm -F @explorer/db exec drizzle-kit migrate
      - name: Rebrand grep gate
        run: |
          # Scan all tracked files (git grep respects .gitignore) for legacy
          # brand identifiers, excluding this workflow by path — it necessarily
          # contains the pattern to define the gate. Path-based exclusion is
          # reliable across grep implementations (unlike --exclude=basename).
          if git grep -niE "aiblock|aibcoin|@2waychain|2wayjs|ablock" \
               -- ':!.github/workflows/ci.yml'; then
            echo "Found forbidden legacy-brand strings (see matches above)"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer
          POSTGRES_DB: explorer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorer"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://explorer:explorer@localhost:5432/explorer_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @explorer/web exec playwright install --with-deps chromium
      - run: pnpm -F @explorer/web e2e
