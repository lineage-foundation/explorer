services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-explorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-explorer}
      POSTGRES_DB: ${POSTGRES_DB:-explorer}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-explorer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create/update the schema by applying the committed, idempotent,
  # correctly-ordered migration SQL via psql (no extra tooling needed). Runs
  # once and exits; web/indexer wait for it to complete.
  migrate:
    image: postgres:16
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-explorer}
    volumes:
      - ./packages/db/drizzle:/migrations:ro
    command: >-
      sh -c 'set -e; for f in $$(ls /migrations/*.sql | sort); do echo "applying $$f";
      psql -h postgres -U ${POSTGRES_USER:-explorer} -d ${POSTGRES_DB:-explorer} -v ON_ERROR_STOP=1 -f "$$f"; done'
    restart: "no"

  # The `web` and `indexer` services run the whole explorer in Docker. They are
  # self-contained: internal `postgres` service + the ../fleet node reached on
  # the host via host.docker.internal (fleet runs in its own compose project).
  # Independent of the root `.env`, which configures host-run `pnpm dev` instead.
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      DATABASE_URL: postgres://explorer:explorer@postgres:5432/explorer
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  indexer:
    build: { context: ., dockerfile: apps/indexer/Dockerfile }
    environment:
      DATABASE_URL: postgres://explorer:explorer@postgres:5432/explorer
      LINEAGE_STORAGE_NODE_URL: http://host.docker.internal:3001
      LINEAGE_MEMPOOL_NODE_URL: http://host.docker.internal:3003
      HEALTH_PORT: "8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
