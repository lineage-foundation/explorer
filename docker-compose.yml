services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-explorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-explorer}
      POSTGRES_DB: ${POSTGRES_DB:-explorer}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-explorer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  indexer:
    build: { context: ., dockerfile: apps/indexer/Dockerfile }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LINEAGE_STORAGE_NODE_URL: ${LINEAGE_STORAGE_NODE_URL}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
