<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Lineage">
  <title>Lineage</title>
  <!-- Favicon glyph: converged centre + flat colours. At 16px the open centre would read
       as an accidental gap, so the four blades meet solid; hex colours guarantee the tab
       renders even where oklch() is unsupported. -->
  <rect width="32" height="32" rx="7" fill="#0d1a18"/>
  <path d="M4,7 L16,16 L28,7 L24,3.5 L16,11.5 L8,3.5 Z M4,25 L16,16 L28,25 L24,28.5 L16,20.5 L8,28.5 Z" fill="#5ad0e6"/>
  <path d="M7,4 L16,16 L7,28 L3.5,24 L11.5,16 L3.5,8 Z M25,4 L16,16 L25,28 L28.5,24 L20.5,16 L28.5,8 Z" fill="#52e3a8"/>
</svg>
