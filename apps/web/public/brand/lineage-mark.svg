<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" role="img" aria-label="Lineage">
  <title>Lineage</title>
  <!-- Clearing Cross (mark 04-B): two tapered blades crossing — cyan (interaction) over
       emerald (action) — meeting at an open centre. The cleared price is the light
       between them: emergent, verifiable, owned by no one. -->
  <defs>
    <radialGradient id="lin-blade-c" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="oklch(92% 0.13 205)"/>
      <stop offset="1" stop-color="oklch(72% 0.12 220)"/>
    </radialGradient>
    <radialGradient id="lin-blade-a" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="oklch(93% 0.16 167)"/>
      <stop offset="1" stop-color="oklch(78% 0.15 160)"/>
    </radialGradient>
  </defs>
  <path d="M6,7 L16,15 L26,7 L24.6,5.8 L16,13 L7.4,5.8 Z M6,25 L16,17 L26,25 L24.6,26.2 L16,19 L7.4,26.2 Z" fill="url(#lin-blade-c)"/>
  <path d="M7,6 L15,16 L7,26 L5.4,24.6 L12,16 L5.4,7.4 Z M25,6 L17,16 L25,26 L26.6,24.6 L20,16 L26.6,7.4 Z" fill="url(#lin-blade-a)"/>
</svg>
